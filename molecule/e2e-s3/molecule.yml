---
dependency:
  name: galaxy
  options:
    force: true

driver:
  name: docker

platforms:
  - name: "dupwrap-e2e-s3-${MOLECULE_DISTRO:-ubuntu2404}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    env:
      DUPWRAP_E2E_BUCKET_URI: "${DUPWRAP_E2E_BUCKET_URI}"
      DUPWRAP_E2E_AWS_ACCESS_KEY_ID: "${DUPWRAP_E2E_AWS_ACCESS_KEY_ID}"
      DUPWRAP_E2E_AWS_SECRET_ACCESS_KEY: "${DUPWRAP_E2E_AWS_SECRET_ACCESS_KEY}"

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible-${USER}/tmp/
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml
  env:
    ANSIBLE_ROLES_PATH: "${HOME}/.ansible/roles:${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
