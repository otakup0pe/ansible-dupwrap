---
dependency:
  name: galaxy
  options:
    force: true

driver:
  name: docker

platforms:
  - name: "dupwrap-${MOLECULE_DISTRO:-ubuntu2404}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible-${USER}/tmp/
  playbooks:
    prepare: "../../tests/prepare.yml"
    converge: "../../tests/playbook.yml"
    verify: "../../tests/verify.yml"
  env:
    ANSIBLE_ROLES_PATH: "${HOME}/.ansible/roles:${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
